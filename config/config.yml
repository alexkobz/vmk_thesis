      - EQBR
      - TQBS
      - EQBS
      - TQLV
      - EQLV
      - TQNL
      - EQNL

  drop_additional_issues:
    by:
      - base_secid
      - tradedate
      - boardid
    template: -0.*$

  filter_null_cols:

  categorize:
    cols:
      type: common_share
      sector: other

  gather_secids:

  replace_zeros_with_nan:

  set_index:
    sort_by:
      secid: True
      tradedate: True
      volume: False

  fill_periods:
    freq: D

  ffill_bfill:

  filter_years:
