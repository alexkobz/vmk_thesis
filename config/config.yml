training:
  target_params:
    shift_period: 1
    target_column: bike_count
    new_target_name: target

  train_fraction: 0.8

  model_type: catboost

  model_params:
    catboost:
      learning_rate: 0.2
      depth: 6
      l2_leaf_reg: 1
      iterations: 50 # 500
      loss_function: RMSE
      verbose: 0
      random_seed: 42
      allow_writing_files: false

    random_forest:
      n_estimators: 100
      max_depth: 6
      min_samples_split: 2
      min_samples_leaf: 1
      max_features: 'auto'
      random_seed: 42
      verbose: 0
      allow_writing_files: false

  base_cols:
    - secid
    - tradedate
    - is_vacation
    - issue_cumsum
    - y_name
    - y_log
    - lr__dailycapitalization_30

evaluate:
    metrics:
