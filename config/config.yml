y_name: dailycapitalization
y_log: lr__dailycapitalization_1
secid: secid
tradedate: tradedate
year: year
boardid: boardid
inn: inn
is_vacation: is_vacation
issue_cumsum: issue_cumsum
close: close
type: type
sector: sector
x_lr_30: lr__dailycapitalization_30

index_cols:
  - secid
  - tradedate


data_processing:

  raw_dataset_name: dataset.csv

  filter_boards:
    boards:
      - TQBR # акции, основной стакан (T+2)
      - EQBR # акции (аналог TQBR, но менее ликвидный)
      - TQBS # акции, T+ режим (вариация расчётов, реже используется)
      - EQBS # режим расчётов
      - TQLV # низколиквидные бумаги
      - EQLV # low volume
      - TQNL # неликвид / ограниченный режим
      - EQNL # неликвид

  drop_additional_issues:
    by:
      - base_secid
      - tradedate
      - boardid
    template: -0.*$

  filter_null_cols:

  categorize:
    cols:
      type: common_share
      sector: other

  gather_secids:

  replace_zeros_with_nan:

  set_index:
    sort_by:
      secid: True
      tradedate: True
      dailycapitalization: False

  fill_periods:
    freq: D

  ffill_bfill:

  filter_years:
    years:
      - 2011
      - 2012
      - 2013
      - 2014
      - 2015
      - 2016
      - 2017
      - 2018
      - 2019
      - 2020
      - 2021
      - 2022
      - 2023
      - 2024

  filter_secids:
    num: 5000 # количество дней, в которые должна быть представлена бумага, чтобы попасть в датасет


